services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-themuno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-themuno}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate:postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-themuno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-themuno}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-themuno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-themuno}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Defina CREDENTIAL_ENCRYPTION_KEY}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
